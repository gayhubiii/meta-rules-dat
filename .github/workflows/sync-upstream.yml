name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # temporary: every 5 minutes to trigger now

permissions:
  contents: write

env:
  UPSTREAM_REPO: MetaCubeX/meta-rules-dat
  UPSTREAM_BRANCH: meta
  BASE_BRANCH: meta

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream --tags

      - name: Merge upstream
        run: |
          git checkout "${BASE_BRANCH}"
          git merge --no-edit -X ours "upstream/${UPSTREAM_BRANCH}"

      - name: Push
        run: |
          git push origin "${BASE_BRANCH}"

      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"meta"}'
